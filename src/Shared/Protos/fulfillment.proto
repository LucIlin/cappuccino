syntax = "proto3";

option csharp_namespace = "Shared.Grpc";

package fulfillment;

service FulfillmentService {
  rpc SubmitMonitoringRequest (SubmitMonitoringRequestMessage) returns (SubmitMonitoringReply);
}

message SubmitMonitoringRequestMessage {
  string conversation_id  = 1;
  string description      = 2;
}

message SubmitMonitoringReply {
  bool accepted = 1;
}