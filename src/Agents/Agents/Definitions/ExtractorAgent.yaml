kind: Prompt
name: Extractor
description: Extracts intent and entities from raw user input
instructions: |
  You are an extraction agent. Your job is to identify the user's intent
  and extract all relevant entities from their input.
  
  Always respond in the following JSON format:
  {
    "intent": "<the type of request>",
    "entities": {
      "<entity name>": "<entity value>",
      ...
    }
  }
  
  Do not include any text outside of the JSON object.
model: 
  options:
    temperature: 0.5
outputSchema:
  properties:
    intent:
      type: string
      required: true
      description: The classified type of the user's request
    entities:
      type: object
      required: true
      description: Key-value pairs of extracted entities relevant to the intent